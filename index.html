<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Thần Sâm - Made by Le Anh</title>

    <!-- CẤU HÌNH ĐỂ TRÔNG NHƯ APP THẬT TRÊN IPHONE -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Thần Sâm">
    
    <!-- ICON APP -->
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">

    <!-- CSS & Frameworks -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 pb-24">

    <!-- Header -->
    <header class="bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 sticky top-0 z-40 px-5 py-2.5 flex items-center justify-between shadow-sm">
        <div class="flex items-center gap-2.5">
            <div class="bg-indigo-600 p-1.5 rounded-lg shadow-md shadow-indigo-200 dark:shadow-none text-white flex items-center justify-center">
                <i data-lucide="flame" class="w-4 h-4"></i>
            </div>
            <div>
                <h1 id="app-title" data-i18n="app_name" class="text-sm font-black tracking-tight leading-none uppercase text-slate-800 dark:text-slate-100">Thần <span class="text-indigo-600 dark:text-indigo-400">Sâm</span></h1>
                <p class="text-[8px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-widest mt-0.5">Made by Le Anh</p>
            </div>
        </div>
        <div class="flex gap-1.5 items-center">
            <!-- Language Selector Dropdown -->
            <div id="lang-container" class="relative">
                <button onclick="toggleLangMenu(event)" id="lang-btn" aria-label="Language Selector" class="p-1.5 text-slate-500 dark:text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 bg-slate-50 dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700 transition-all shadow-sm flex items-center justify-center">
                    <i data-lucide="languages" class="w-3.5 h-3.5"></i>
                </button>
                <div id="lang-dropdown" class="hidden absolute right-0 mt-2 w-36 bg-white dark:bg-slate-900 rounded-2xl shadow-xl border border-slate-200 dark:border-slate-800 p-1.5 z-50 modal-animate-in">
                    <button onclick="setLanguage('vi')" data-lang="vi" class="lang-item w-full flex items-center justify-between px-3 py-2 text-xs font-bold rounded-xl transition-colors hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200">
                        <span class="flex items-center gap-2.5">
                            <svg class="w-5 h-3.5 rounded-[3px] border border-slate-200/80 dark:border-slate-700/80 shadow-xs flex-shrink-0" viewBox="0 0 30 20" xmlns="http://www.w3.org/2000/svg">
                                <rect width="30" height="20" fill="#da251d"/>
                                <polygon points="15,4 16.35,8.15 20.71,8.15 17.18,10.71 18.53,14.85 15,12.29 11.47,14.85 12.82,10.71 9.29,8.15 13.65,8.15" fill="#FFFF00"/>
                            </svg>
                            <span>Tiếng Việt</span>
                        </span>
                        <i data-lucide="check" class="w-3.5 h-3.5 text-indigo-600 dark:text-indigo-400 hidden checkmark"></i>
                    </button>
                    <button onclick="setLanguage('en')" data-lang="en" class="lang-item w-full flex items-center justify-between px-3 py-2 text-xs font-bold rounded-xl transition-colors hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200">
                        <span class="flex items-center gap-2.5">
                            <svg class="w-5 h-3.5 rounded-[3px] border border-slate-200/80 dark:border-slate-700/80 shadow-xs flex-shrink-0" viewBox="0 0 60 40" xmlns="http://www.w3.org/2000/svg">
                                <rect width="60" height="40" fill="#012169"/>
                                <path d="M0,0 L60,40 M60,0 L0,40" stroke="#ffffff" stroke-width="7"/>
                                <path d="M0,0 L30,20 M60,40 L30,20" stroke="#C8102E" stroke-width="2.4"/>
                                <path d="M60,0 L30,20 M0,40 L30,20" stroke="#C8102E" stroke-width="2.4"/>
                                <path d="M30,0 v40 M0,20 h60" stroke="#ffffff" stroke-width="12"/>
                                <path d="M30,0 v40 M0,20 h60" stroke="#C8102E" stroke-width="7.2"/>
                            </svg>
                            <span>English</span>
                        </span>
                        <i data-lucide="check" class="w-3.5 h-3.5 text-indigo-600 dark:text-indigo-400 hidden checkmark"></i>
                    </button>
                    <button onclick="setLanguage('ja')" data-lang="ja" class="lang-item w-full flex items-center justify-between px-3 py-2 text-xs font-bold rounded-xl transition-colors hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200">
                        <span class="flex items-center gap-2.5">
                            <svg class="w-5 h-3.5 rounded-[3px] border border-slate-200/80 dark:border-slate-700/80 shadow-xs flex-shrink-0" viewBox="0 0 30 20" xmlns="http://www.w3.org/2000/svg">
                                <rect width="30" height="20" fill="#ffffff"/>
                                <circle cx="15" cy="10" r="6" fill="#bc002d"/>
                            </svg>
                            <span>日本語</span>
                        </span>
                        <i data-lucide="check" class="w-3.5 h-3.5 text-indigo-600 dark:text-indigo-400 hidden checkmark"></i>
                    </button>
                    <button onclick="setLanguage('zh')" data-lang="zh" class="lang-item w-full flex items-center justify-between px-3 py-2 text-xs font-bold rounded-xl transition-colors hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200">
                        <span class="flex items-center gap-2.5">
                            <svg class="w-5 h-3.5 rounded-[3px] border border-slate-200/80 dark:border-slate-700/80 shadow-xs flex-shrink-0" viewBox="0 0 30 20" xmlns="http://www.w3.org/2000/svg">
                                <rect width="30" height="20" fill="#de2910"/>
                                <polygon points="5,2 5.9,4.8 8.8,4.8 6.5,6.5 7.4,9.2 5,7.6 2.6,9.2 3.5,6.5 1.2,4.8 4.1,4.8" fill="#ffde00"/>
                                <polygon points="10,1.2 10.3,2.2 11.3,2.2 10.5,2.8 10.8,3.7 10,3.2 9.2,3.7 9.5,2.8 8.7,2.2 9.7,2.2" transform="rotate(23 10 2)" fill="#ffde00"/>
                                <polygon points="12,3.2 12.3,4.2 13.3,4.2 12.5,4.8 12.8,5.7 12,5.2 11.2,5.7 11.5,4.8 10.7,4.2 11.7,4.2" transform="rotate(45 12 4)" fill="#ffde00"/>
                                <polygon points="12,6.2 12.3,7.2 13.3,7.2 12.5,7.8 12.8,8.7 12,8.2 11.2,8.7 11.5,7.8 10.7,7.2 11.7,7.2" transform="rotate(0 12 7)" fill="#ffde00"/>
                                <polygon points="10,8.2 10.3,9.2 11.3,9.2 10.5,9.8 10.8,10.7 10,10.2 9.2,10.7 9.5,9.8 8.7,9.2 9.7,9.2" transform="rotate(-20 10 9)" fill="#ffde00"/>
                            </svg>
                            <span>中文</span>
                        </span>
                        <i data-lucide="check" class="w-3.5 h-3.5 text-indigo-600 dark:text-indigo-400 hidden checkmark"></i>
                    </button>
                </div>
            </div>

            <button onclick="toggleTheme()" class="p-1.5 text-slate-500 dark:text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 bg-slate-50 dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700 transition-all shadow-sm">
                <i id="theme-icon" data-lucide="moon" class="w-3.5 h-3.5"></i>
            </button>
            <button onclick="openModal('reset-modal')" class="p-1.5 text-slate-500 dark:text-slate-400 hover:text-rose-500 bg-slate-50 dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700 transition-all shadow-sm">
                <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
            </button>
        </div>
    </header>

    <main class="max-w-2xl mx-auto p-4 space-y-5">
        
        <!-- Navigation -->
        <div class="flex bg-white dark:bg-slate-900 p-1 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm">
            <button onclick="switchTab('active')" id="tab-active" class="flex-1 flex items-center justify-center gap-2 py-2.5 rounded-xl text-[11px] font-bold transition-all duration-300 bg-indigo-600 text-white shadow-md">
                <i data-lucide="plus" class="w-3.5 h-3.5"></i> <span data-i18n="tab_score" class="uppercase tracking-widest font-black">Ghi Điểm</span>
            </button>
            <button onclick="switchTab('history')" id="tab-history" class="flex-1 flex items-center justify-center gap-2 py-2.5 rounded-xl text-[11px] font-bold transition-all duration-300 text-slate-400 dark:text-slate-500 hover:bg-slate-50 dark:hover:bg-slate-800">
                <i data-lucide="history" class="w-3.5 h-3.5"></i> <span data-i18n="tab_history" class="uppercase tracking-widest font-black">Lịch Sử</span>
            </button>
        </div>

        <!-- VIEW: ACTIVE -->
        <div id="view-active" class="space-y-5">
            <!-- Form thêm người chơi -->
            <div id="setup-section" class="bg-white dark:bg-slate-900 p-4 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-sm">
                <form onsubmit="addPlayer(event)" class="flex gap-2">
                    <input id="new-player-name" type="text" data-i18n-placeholder="player_input_placeholder" placeholder="Tên tay chơi mới..." class="flex-1 px-4 py-2 bg-slate-50 dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 focus:ring-2 focus:ring-indigo-500 outline-none text-sm font-bold text-slate-800 dark:text-slate-100">
                    <button type="submit" data-i18n="btn_add_player" class="bg-indigo-600 dark:bg-indigo-500 text-white px-4 rounded-xl font-black text-[11px] uppercase shadow-md active:scale-95 text-[10px]">Thêm</button>
                </form>
            </div>

            <!-- Biểu đồ phong độ -->
            <div id="chart-section" class="hidden bg-white dark:bg-slate-900 p-5 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-sm relative overflow-visible">
                <div class="flex justify-between items-center mb-14">
                    <div class="flex items-center gap-2">
                        <i data-lucide="trending-up" class="w-4 h-4 text-indigo-600 dark:text-indigo-400"></i>
                        <h2 data-i18n="standings_title" class="text-xs font-bold text-slate-800 dark:text-slate-200 uppercase tracking-widest">Phong độ hiện tại</h2>
                    </div>
                    <span id="round-count" class="text-[10px] font-bold text-slate-400 dark:text-slate-500 bg-slate-100 dark:bg-slate-800 px-2 py-1 rounded-full uppercase tracking-tighter">0 ván</span>
                </div>
                <div class="relative h-48 flex items-center mb-10 overflow-visible" id="chart-container">
                    <div class="absolute w-full h-[1.5px] bg-slate-200 dark:bg-slate-800 z-0"></div>
                    <div id="chart-bars" class="flex w-full justify-around items-stretch h-full z-10 overflow-visible px-1"></div>
                </div>
            </div>

            <!-- Khung ghi điểm ván hiện tại -->
            <div id="scoring-section" class="hidden bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-sm overflow-hidden">
                <div class="bg-slate-50/80 dark:bg-slate-800/50 px-5 py-3 border-b border-slate-200 dark:border-slate-800 flex justify-between items-center">
                    <h2 id="current-round-title" class="text-[10px] font-black text-slate-800 dark:text-slate-200 uppercase tracking-widest flex items-center gap-2">
                        <i data-lucide="star" class="w-3.5 h-3.5 text-yellow-500 fill-yellow-500"></i> Ván đấu thứ 1
                    </h2>
                    <button onclick="openModal('clear-scores-modal')" class="flex items-center gap-1 text-[9px] font-black text-rose-500 bg-rose-50 dark:bg-rose-900/20 px-2 py-1 rounded-lg border border-rose-100 dark:border-rose-900/30 active:scale-95 transition-all">
                        <i data-lucide="trash-2" class="w-2.5 h-2.5"></i> <span data-i18n="btn_clear_scores">XÓA ĐIỂM</span>
                    </button>
                </div>
                <div class="p-4 space-y-2.5" id="players-list"></div>
                <div class="p-4 pt-2 space-y-3">
                    <button onclick="calculateTotalLeaves()" class="w-full bg-emerald-50 dark:bg-emerald-900/10 text-emerald-700 dark:text-emerald-400 border-2 border-emerald-200 dark:border-emerald-900/30 py-3 rounded-2xl font-black text-xs uppercase tracking-widest shadow-sm active:scale-95 flex items-center justify-center gap-2">
                        <i data-lucide="calculator" class="w-4 h-4"></i> <span data-i18n="btn_calc_winner">TÍNH TỔNG LÁ CHO NGƯỜI THẮNG</span>
                    </button>
                    <button onclick="saveRound()" id="save-round-btn" class="w-full bg-indigo-600 dark:bg-indigo-600 text-white py-4 rounded-2xl font-black active:scale-95 flex flex-col items-center justify-center gap-1 shadow-lg shadow-indigo-100 dark:shadow-none transition-all opacity-50 cursor-not-allowed btn-save-glow">
                        <i data-lucide="save" class="w-5 h-5"></i>
                        <span id="save-btn-text" class="text-[10px] uppercase tracking-[0.2em]">LƯU ĐIỂM VÁN 1</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- VIEW: HISTORY -->
        <div id="view-history" class="hidden space-y-4">
            <div class="relative group">
                <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 dark:text-slate-500 w-4 h-4"></i>
                <input type="text" id="history-search" oninput="renderHistory()" data-i18n-placeholder="history_search_placeholder" placeholder="Tìm ván, điểm, tên..." class="w-full pl-10 pr-4 py-2.5 bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm focus:ring-2 focus:ring-indigo-500 outline-none font-bold text-[13px] text-slate-800 dark:text-slate-100 text-[12px]">
            </div>
            <div id="history-list" class="space-y-3 pb-4"></div>
        </div>
    </main>

    <!-- Modals -->
    <div id="reset-modal" class="fixed inset-0 z-[70] hidden flex items-center justify-center p-6 bg-slate-900/60 backdrop-blur-md">
        <div class="bg-white dark:bg-slate-900 w-full max-w-sm rounded-[32px] shadow-2xl p-8 border border-slate-100 dark:border-slate-800 text-center modal-animate-in">
            <div class="w-16 h-16 bg-rose-50 dark:bg-rose-900/20 text-rose-500 rounded-full flex items-center justify-center mx-auto mb-6"><i data-lucide="rotate-ccw" class="w-8 h-8"></i></div>
            <h3 data-i18n="modal_reset_title" class="text-lg font-black text-slate-800 dark:text-slate-100 mb-3 uppercase tracking-tight text-center">Xóa sạch trận chơi?</h3>
            <p data-i18n="modal_reset_desc" class="text-sm text-slate-500 dark:text-slate-400 font-medium mb-8 text-center text-[13px]">Dữ liệu sẽ bị xóa hoàn toàn khỏi thiết bị.</p>
            <div class="flex flex-col gap-3">
                <button onclick="resetGame()" data-i18n="modal_reset_confirm" class="w-full py-4 bg-rose-500 text-white rounded-2xl font-black text-sm uppercase shadow-lg active:scale-95 text-[11px]">XÓA NGAY</button>
                <button onclick="closeModal('reset-modal')" data-i18n="modal_reset_cancel" class="w-full py-4 bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 rounded-2xl font-black text-sm uppercase text-[11px]">HỦY BỎ</button>
            </div>
        </div>
    </div>

    <div id="clear-scores-modal" class="fixed inset-0 z-[70] hidden flex items-center justify-center p-6 bg-slate-900/60 backdrop-blur-md">
        <div class="bg-white dark:bg-slate-900 w-full max-w-sm rounded-[32px] shadow-2xl p-8 border border-slate-100 dark:border-slate-800 text-center modal-animate-in">
            <div class="w-16 h-16 bg-amber-50 dark:bg-amber-900/20 text-amber-500 rounded-full flex items-center justify-center mx-auto mb-6"><i data-lucide="trash-2" class="w-8 h-8"></i></div>
            <h3 id="clear-modal-title" data-i18n="modal_clear_title" class="text-lg font-black text-slate-800 dark:text-slate-100 mb-3 uppercase tracking-tight text-center">Xóa điểm ván này?</h3>
            <div class="flex flex-col gap-3">
                <button onclick="confirmClearScores()" data-i18n="modal_clear_confirm" class="w-full py-4 bg-amber-500 text-white rounded-2xl font-black text-sm uppercase shadow-lg active:scale-95 text-[11px]">XÁC NHẬN</button>
                <button onclick="closeModal('clear-scores-modal')" data-i18n="modal_clear_cancel" class="w-full py-4 bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 rounded-2xl font-black text-sm uppercase text-[11px]">HỦY BỎ</button>
            </div>
        </div>
    </div>

    <div id="delete-round-modal" class="fixed inset-0 z-[70] hidden flex items-center justify-center p-6 bg-slate-900/60 backdrop-blur-md">
        <div class="bg-white dark:bg-slate-900 w-full max-w-sm rounded-[32px] shadow-2xl p-8 border border-slate-100 dark:border-slate-800 text-center modal-animate-in">
            <div class="w-16 h-16 bg-rose-50 dark:bg-rose-900/20 text-rose-500 rounded-full flex items-center justify-center mx-auto mb-6"><i data-lucide="trash-2" class="w-8 h-8"></i></div>
            <h3 data-i18n="modal_delete_title" class="text-lg font-black text-slate-800 dark:text-slate-100 mb-3 uppercase tracking-tight text-center">Xóa ván chơi này?</h3>
            <p data-i18n="modal_delete_desc" class="text-sm text-slate-500 dark:text-slate-400 font-medium mb-8 text-center text-[13px]">Thao tác này không thể hoàn tác.</p>
            <div class="flex flex-col gap-3">
                <button id="confirm-delete-round-btn" data-i18n="modal_delete_confirm" class="w-full py-4 bg-rose-500 text-white rounded-2xl font-black text-sm uppercase shadow-lg active:scale-95 text-[11px]">XÓA VÁN</button>
                <button onclick="closeModal('delete-round-modal')" data-i18n="modal_delete_cancel" class="w-full py-4 bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 rounded-2xl font-black text-sm uppercase text-[11px]">HỦY BỎ</button>
            </div>
        </div>
    </div>

    <!-- Modal chọn người bị chặt (Dùng chung cho Chặt 2 và Bắt sâm) -->
    <div id="action-target-modal" class="fixed inset-0 z-[60] hidden flex items-center justify-center p-6 bg-slate-900/40 backdrop-blur-sm">
        <div class="bg-white dark:bg-slate-900 w-full max-w-sm rounded-3xl shadow-2xl border border-slate-100 dark:border-slate-800 p-6 modal-animate-in">
            <div class="flex justify-between items-center mb-6">
                <h3 id="action-modal-title" class="text-sm font-black text-slate-800 dark:text-slate-200 uppercase tracking-widest">Ai bị bắt?</h3>
                <button onclick="closeModal('action-target-modal')" class="p-1 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full transition-colors">
                    <i data-lucide="x" class="w-5 h-5 text-slate-400 dark:text-slate-500"></i>
                </button>
            </div>
            <div id="action-target-list" class="space-y-3"></div>
        </div>
    </div>

    <footer class="fixed bottom-0 left-0 right-0 bg-white/90 dark:bg-slate-900/90 backdrop-blur-xl border-t border-slate-200 dark:border-slate-800 py-3 px-6 flex justify-between items-center z-40 shadow-lg">
        <div class="flex items-center gap-2">
            <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
            <span data-i18n="footer_local_mode" class="text-[10px] font-black text-slate-500 dark:text-slate-400 uppercase tracking-widest uppercase">Thần Sâm Local Mode</span>
        </div>
        <div class="text-[9px] font-black text-slate-300 dark:text-slate-600 uppercase tracking-widest flex items-center gap-2">Made by Le Anh <i data-lucide="chevron-right" class="w-2.5 h-2.5"></i></div>
    </footer>

    <!-- Logic Scripts -->
    <script src="i18n.js"></script>
    <script src="app.js"></script>
</body>
</html>

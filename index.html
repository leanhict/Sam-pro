<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Thần Sâm - Made by Le Anh</title>

    <!-- CẤU HÌNH ĐỂ TRÔNG NHƯ APP THẬT TRÊN IPHONE -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Thần Sâm">
    
    <!-- ICON APP: Sử dụng file cục bộ nằm cùng thư mục -->
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        // Cấu hình Tailwind hỗ trợ class dark
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: contain; 
            transition: background-color 0.3s ease;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .modal-animate-in {
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .chart-bar-transition {
            transition: height 1s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Tối ưu cho bàn phím số iPhone */
        input[type="text"] {
            font-size: 18px !important;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 pb-24">

    <!-- Header -->
    <header class="bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 sticky top-0 z-40 px-6 py-4 flex items-center justify-between shadow-sm">
        <div class="flex items-center gap-3">
            <div class="bg-indigo-600 p-2.5 rounded-xl shadow-lg shadow-indigo-200 dark:shadow-indigo-900/20 text-white">
                <i data-lucide="flame" class="w-5 h-5"></i>
            </div>
            <div>
                <h1 class="text-base font-black tracking-tight leading-none uppercase text-slate-800 dark:text-slate-100">Thần <span class="text-indigo-600 dark:text-indigo-400">Sâm</span></h1>
                <p class="text-[9px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-widest mt-1">Made by Le Anh</p>
            </div>
        </div>
        <div class="flex gap-2" id="header-actions">
            <button onclick="toggleTheme()" class="p-2 text-slate-500 dark:text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 bg-slate-50 dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700 transition-all shadow-sm">
                <i id="theme-icon" data-lucide="moon" class="w-4 h-4"></i>
            </button>
            <button onclick="openModal('reset-modal')" class="p-2 text-slate-500 dark:text-slate-400 hover:text-rose-500 bg-slate-50 dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700 transition-all shadow-sm">
                <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
            </button>
        </div>
    </header>

    <main class="max-w-2xl mx-auto p-4 space-y-5">
        
        <!-- Navigation -->
        <div class="flex bg-white dark:bg-slate-900 p-1 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm">
            <button onclick="switchTab('active')" id="tab-active" class="flex-1 flex items-center justify-center gap-2 py-2.5 rounded-xl text-[11px] font-bold transition-all duration-300 bg-indigo-600 text-white shadow-md">
                <i data-lucide="plus" class="w-3.5 h-3.5"></i> <span class="uppercase tracking-widest font-black">Ghi Điểm</span>
            </button>
            <button onclick="switchTab('history')" id="tab-history" class="flex-1 flex items-center justify-center gap-2 py-2.5 rounded-xl text-[11px] font-bold transition-all duration-300 text-slate-400 dark:text-slate-500 hover:bg-slate-50 dark:hover:bg-slate-800">
                <i data-lucide="history" class="w-3.5 h-3.5"></i> <span class="uppercase tracking-widest font-black">Lịch Sử</span>
            </button>
        </div>

        <!-- VIEW: ACTIVE -->
        <div id="view-active" class="space-y-5">
            <!-- Form thêm người chơi (Sẽ ẩn khi đủ 5 người) -->
            <div id="setup-section" class="bg-white dark:bg-slate-900 p-4 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-sm">
                <form onsubmit="addPlayer(event)" class="flex gap-2">
                    <input id="new-player-name" type="text" placeholder="Tên tay chơi mới..." class="flex-1 px-4 py-2 bg-slate-50 dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 focus:ring-2 focus:ring-indigo-500 outline-none text-sm font-bold text-slate-800 dark:text-slate-100">
                    <button type="submit" class="bg-indigo-600 dark:bg-indigo-500 text-white px-4 rounded-xl font-black text-[11px] uppercase shadow-md active:scale-95">Thêm</button>
                </form>
            </div>

            <!-- Biểu đồ cột -->
            <div id="chart-section" class="hidden bg-white dark:bg-slate-900 p-5 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-sm relative overflow-visible">
                <div class="flex justify-between items-center mb-14">
                    <div class="flex items-center gap-2">
                        <i data-lucide="trending-up" class="w-4 h-4 text-indigo-600 dark:text-indigo-400"></i>
                        <h2 class="text-xs font-bold text-slate-800 dark:text-slate-200 uppercase tracking-widest">Phong độ hiện tại</h2>
                    </div>
                    <span id="round-count" class="text-[10px] font-bold text-slate-400 dark:text-slate-500 bg-slate-100 dark:bg-slate-800 px-2 py-1 rounded-full uppercase tracking-tighter">0 ván</span>
                </div>
                <div class="relative h-48 flex items-center mb-10 overflow-visible" id="chart-container">
                    <div class="absolute w-full h-[1.5px] bg-slate-200 dark:bg-slate-800 z-0"></div>
                    <div id="chart-bars" class="flex w-full justify-around items-stretch h-full z-10 overflow-visible px-1"></div>
                </div>
            </div>

            <!-- Khung ghi điểm ván hiện tại -->
            <div id="scoring-section" class="hidden bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-sm overflow-hidden">
                <div class="bg-slate-50/80 dark:bg-slate-800/50 px-5 py-3 border-b border-slate-200 dark:border-slate-800 flex justify-between items-center">
                    <h2 id="current-round-title" class="text-[10px] font-black text-slate-800 dark:text-slate-200 uppercase tracking-widest flex items-center gap-2">
                        <i data-lucide="star" class="w-3.5 h-3.5 text-yellow-500 fill-yellow-500"></i> Ván đấu thứ 1
                    </h2>
                    <button onclick="openModal('clear-scores-modal')" class="flex items-center gap-1 text-[9px] font-black text-rose-500 bg-rose-50 dark:bg-rose-900/20 px-2 py-1 rounded-lg border border-rose-100 dark:border-rose-900/30 active:scale-95 transition-all">
                        <i data-lucide="trash-2" class="w-2.5 h-2.5"></i> XÓA ĐIỂM
                    </button>
                </div>
                <div class="p-4 space-y-2.5" id="players-list"></div>
                <div class="p-4 pt-2 space-y-3">
                    <button onclick="calculateTotalLeaves()" class="w-full bg-emerald-50 dark:bg-emerald-900/10 text-emerald-700 dark:text-emerald-400 border-2 border-emerald-200 dark:border-emerald-900/30 py-3 rounded-2xl font-black text-xs uppercase tracking-widest shadow-sm active:scale-95 flex items-center justify-center gap-2">
                        <i data-lucide="calculator" class="w-4 h-4"></i> TÍNH TỔNG LÁ CHO NGƯỜI THẮNG
                    </button>
                    <button onclick="saveRound()" id="save-round-btn" class="w-full bg-indigo-600 dark:bg-indigo-50 text-white py-4 rounded-2xl font-black active:scale-95 flex flex-col items-center justify-center gap-1 shadow-lg shadow-indigo-100 dark:shadow-none transition-all opacity-50 cursor-not-allowed">
                        <i data-lucide="save" class="w-5 h-5"></i>
                        <span id="save-btn-text" class="text-[10px] uppercase tracking-[0.2em]">LƯU ĐIỂM VÁN 1</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- VIEW: HISTORY -->
        <div id="view-history" class="hidden space-y-4">
            <div class="relative group">
                <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 dark:text-slate-500 w-4 h-4"></i>
                <input type="text" id="history-search" oninput="renderHistory()" placeholder="Tìm ván, điểm, tên..." class="w-full pl-10 pr-4 py-2.5 bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm focus:ring-2 focus:ring-indigo-500 outline-none font-bold text-[13px] text-slate-800 dark:text-slate-100">
            </div>
            <div id="history-list" class="space-y-3 pb-4"></div>
        </div>
    </main>

    <!-- Modals -->
    <div id="reset-modal" class="fixed inset-0 z-[70] hidden flex items-center justify-center p-6 bg-slate-900/60 backdrop-blur-md">
        <div class="bg-white dark:bg-slate-900 w-full max-w-sm rounded-[32px] shadow-2xl p-8 border border-slate-100 dark:border-slate-800 text-center modal-animate-in">
            <div class="w-16 h-16 bg-rose-50 dark:bg-rose-900/20 text-rose-500 rounded-full flex items-center justify-center mx-auto mb-6"><i data-lucide="rotate-ccw" class="w-8 h-8"></i></div>
            <h3 class="text-lg font-black text-slate-800 dark:text-slate-100 mb-3 uppercase tracking-tight">Xóa sạch trận chơi?</h3>
            <p class="text-sm text-slate-500 dark:text-slate-400 font-medium mb-8">Dữ liệu sẽ bị xóa hoàn toàn khỏi thiết bị.</p>
            <div class="flex flex-col gap-3">
                <button onclick="resetGame()" class="w-full py-4 bg-rose-500 text-white rounded-2xl font-black text-sm uppercase shadow-lg shadow-rose-200 dark:shadow-none active:scale-95">XÓA NGAY</button>
                <button onclick="closeModal('reset-modal')" class="w-full py-4 bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 rounded-2xl font-black text-sm uppercase">HỦY BỎ</button>
            </div>
        </div>
    </div>

    <div id="clear-scores-modal" class="fixed inset-0 z-[70] hidden flex items-center justify-center p-6 bg-slate-900/60 backdrop-blur-md">
        <div class="bg-white dark:bg-slate-900 w-full max-w-sm rounded-[32px] shadow-2xl p-8 border border-slate-100 dark:border-slate-800 text-center modal-animate-in">
            <div class="w-16 h-16 bg-amber-50 dark:bg-amber-900/20 text-amber-500 rounded-full flex items-center justify-center mx-auto mb-6"><i data-lucide="trash-2" class="w-8 h-8"></i></div>
            <h3 id="clear-modal-title" class="text-lg font-black text-slate-800 dark:text-slate-100 mb-3 uppercase tracking-tight text-center">Xóa điểm ván này?</h3>
            <div class="flex flex-col gap-3">
                <button onclick="confirmClearScores()" class="w-full py-4 bg-amber-500 text-white rounded-2xl font-black text-sm uppercase shadow-lg shadow-amber-200 dark:shadow-none active:scale-95">XÁC NHẬN</button>
                <button onclick="closeModal('clear-scores-modal')" class="w-full py-4 bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 rounded-2xl font-black text-sm uppercase">HỦY BỎ</button>
            </div>
        </div>
    </div>

    <!-- Modal Xóa ván trong lịch sử -->
    <div id="delete-round-modal" class="fixed inset-0 z-[70] hidden flex items-center justify-center p-6 bg-slate-900/60 backdrop-blur-md">
        <div class="bg-white dark:bg-slate-900 w-full max-w-sm rounded-[32px] shadow-2xl p-8 border border-slate-100 dark:border-slate-800 text-center modal-animate-in">
            <div class="w-16 h-16 bg-rose-50 dark:bg-rose-900/20 text-rose-500 rounded-full flex items-center justify-center mx-auto mb-6"><i data-lucide="trash-2" class="w-8 h-8"></i></div>
            <h3 class="text-lg font-black text-slate-800 dark:text-slate-100 mb-3 uppercase tracking-tight">Xóa ván chơi này?</h3>
            <p class="text-sm text-slate-500 dark:text-slate-400 font-medium mb-8">Thao tác này không thể hoàn tác.</p>
            <div class="flex flex-col gap-3">
                <button id="confirm-delete-round-btn" class="w-full py-4 bg-rose-500 text-white rounded-2xl font-black text-sm uppercase shadow-lg active:scale-95">XÓA VÁN</button>
                <button onclick="closeModal('delete-round-modal')" class="w-full py-4 bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 rounded-2xl font-black text-sm uppercase">HỦY BỎ</button>
            </div>
        </div>
    </div>

    <div id="chop-modal" class="fixed inset-0 z-[60] hidden flex items-center justify-center p-6 bg-slate-900/40 backdrop-blur-sm">
        <div class="bg-white dark:bg-slate-900 w-full max-w-sm rounded-3xl shadow-2xl border border-slate-100 dark:border-slate-800 p-6 modal-animate-in">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-sm font-black text-slate-800 dark:text-slate-200 uppercase tracking-widest">Chặt 2 của ai?</h3>
                <button onclick="closeModal('chop-modal')" class="p-1 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full"><i data-lucide="x" class="w-5 h-5 text-slate-400 dark:text-slate-500"></i></button>
            </div>
            <div id="chop-players-list" class="space-y-3"></div>
        </div>
    </div>

    <footer class="fixed bottom-0 left-0 right-0 bg-white/90 dark:bg-slate-900/90 backdrop-blur-xl border-t border-slate-200 dark:border-slate-800 py-3 px-6 flex justify-between items-center z-40 shadow-lg">
        <div class="flex items-center gap-2">
            <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
            <span class="text-[10px] font-black text-slate-500 dark:text-slate-400 uppercase tracking-widest">Thần Sâm Local Mode</span>
        </div>
        <div class="text-[9px] font-black text-slate-300 dark:text-slate-600 uppercase tracking-widest flex items-center gap-2">Made by Le Anh <i data-lucide="chevron-right" class="w-2.5 h-2.5"></i></div>
    </footer>

    <script>
        // --- State Management ---
        let players = JSON.parse(localStorage.getItem('thanSamPlayers') || '[]');
        let rounds = JSON.parse(localStorage.getItem('thanSamRounds') || '[]');
        let currentScores = {};
        let isTotalCalculated = false;
        let chopWinnerId = null;
        let editingRoundId = null; // ID ván đang sửa

        // --- Utils ---
        const removeAccents = (str) => {
            if (!str) return '';
            return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D');
        };

        const fuzzySearch = (text, query) => {
            if (!query) return true;
            const cleanQuery = query.trim().replace(/\s+/g, ' ');
            const nText = removeAccents(text.toLowerCase()).replace(/\s+/g, '');
            const nQuery = removeAccents(cleanQuery.toLowerCase()).replace(/\s+/g, '');
            return nText.includes(nQuery);
        };

        // --- Theme Logic ---
        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            updateThemeUI();
        }

        function updateThemeUI() {
            const isDark = document.documentElement.classList.contains('dark');
            const icon = document.getElementById('theme-icon');
            if (icon) {
                icon.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
                lucide.createIcons();
            }
        }

        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            }
            updateThemeUI();
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        // --- Actions ---
        function addPlayer(e) {
            e.preventDefault();
            const input = document.getElementById('new-player-name');
            const name = input.value.trim();
            if (players.length >= 5) { showNotice("Tối đa 5 người thôi!", "warning"); return; }
            if (!name) return;
            players.push({ id: Date.now().toString(), name });
            input.value = '';
            sync();
        }

        function handleScoreChange(id, val) {
            isTotalCalculated = false;
            const clean = val.replace(/[^0-9-]/g, ''); // Giữ dấu âm nếu nhập trực tiếp
            if (!clean || clean === '-') {
                delete currentScores[id];
            } else {
                const num = parseInt(clean);
                // Nếu đang nhập số dương, tự động chuyển âm
                currentScores[id] = (num > 0 && !val.includes('-')) ? -num : num;
            }
            renderPlayersList();
            updateSaveButton();
        }

        function calculateTotalLeaves() {
            const missing = players.filter(p => currentScores[p.id] === undefined);
            if (missing.length > 1) { showNotice("Hãy nhập điểm cho người thua!", "warning"); return; }
            if (missing.length === 0) return;
            const winnerId = missing[0].id;
            let total = 0;
            players.forEach(p => { if (p.id !== winnerId) total += Math.abs(currentScores[p.id] || 0); });
            if (total === 0) { showNotice("Nhập lá phạt trước!", "warning"); return; }
            currentScores[winnerId] = total;
            isTotalCalculated = true;
            renderPlayersList();
            updateSaveButton();
            showNotice(`+${total} cho ${missing[0].name}`, "success");
        }

        function quickAction(id, type) {
            if (type === 'AN_SAM') {
                players.forEach(p => { currentScores[p.id] = (p.id === id) ? (players.length - 1) * 20 : -20; });
                isTotalCalculated = true;
                renderPlayersList();
                updateSaveButton();
            } else if (type === 'CHAT_2') {
                chopWinnerId = id;
                renderChopList();
                openModal('chop-modal');
            }
        }

        function executeChop(loserId) {
            currentScores[chopWinnerId] = (currentScores[chopWinnerId] || 0) + 20;
            currentScores[loserId] = (currentScores[loserId] || 0) - 20;
            closeModal('chop-modal');
            renderPlayersList();
            showNotice("Đã chặt +20/-20");
        }

        function saveRound() {
            if (!isTotalCalculated) { showNotice("Hãy tính tổng lá trước!", "warning"); return; }
            
            const roundData = {
                id: editingRoundId || Date.now(),
                timestamp: new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }),
                scores: { ...currentScores }
            };

            if (editingRoundId) {
                const idx = rounds.findIndex(r => r.id === editingRoundId);
                if (idx !== -1) rounds[idx] = roundData;
                editingRoundId = null;
                showNotice("Đã cập nhật ván chơi", "success");
            } else {
                rounds.push(roundData);
                showNotice("Đã lưu ván mới", "success");
            }

            currentScores = {};
            isTotalCalculated = false;
            sync();
        }

        function editRound(id) {
            const round = rounds.find(r => r.id === id);
            if (!round) return;
            
            editingRoundId = id;
            currentScores = { ...round.scores };
            isTotalCalculated = true; // Mặc định coi như đã tính tổng khi load từ lịch sử
            
            switchTab('active');
            renderAll();
            showNotice("Đang sửa ván đấu...", "info");
        }

        function deleteRound(id) {
            const btn = document.getElementById('confirm-delete-round-btn');
            btn.onclick = () => {
                rounds = rounds.filter(r => r.id !== id);
                if (editingRoundId === id) {
                    editingRoundId = null;
                    currentScores = {};
                    isTotalCalculated = false;
                }
                sync();
                closeModal('delete-round-modal');
                showNotice("Đã xóa ván chơi", "info");
            };
            openModal('delete-round-modal');
        }

        function confirmClearScores() {
            currentScores = {};
            isTotalCalculated = false;
            editingRoundId = null; // Hủy chế độ sửa nếu đang sửa
            closeModal('clear-scores-modal');
            renderAll();
        }

        function resetGame() {
            players = []; rounds = []; currentScores = {}; isTotalCalculated = false; editingRoundId = null;
            localStorage.clear();
            closeModal('reset-modal');
            sync();
        }

        function showNotice(msg, type) {
            const toast = document.createElement('div');
            const bgClass = type === 'warning' ? 'bg-rose-500' : (type === 'success' ? 'bg-emerald-600' : 'bg-slate-800 dark:bg-slate-700');
            toast.className = `fixed top-24 left-1/2 -translate-x-1/2 z-[100] px-5 py-2.5 rounded-2xl shadow-xl text-white font-bold text-[11px] flex items-center gap-2 animate-in slide-in-from-top-4 ${bgClass}`;
            toast.innerHTML = `<i data-lucide="${type==='warning' ? 'alert-circle' : 'zap'}" class="w-4 h-4 text-white"></i> ${msg}`;
            document.body.appendChild(toast);
            lucide.createIcons();
            setTimeout(() => toast.remove(), 3000);
        }

        function sync() {
            localStorage.setItem('thanSamPlayers', JSON.stringify(players));
            localStorage.setItem('thanSamRounds', JSON.stringify(rounds));
            renderAll();
        }

        function switchTab(tab) {
            document.getElementById('view-active').classList.toggle('hidden', tab !== 'active');
            document.getElementById('view-history').classList.toggle('hidden', tab !== 'history');
            const btnA = document.getElementById('tab-active');
            const btnH = document.getElementById('tab-history');
            if (tab === 'active') {
                btnA.className = "flex-1 flex items-center justify-center gap-2 py-2.5 rounded-xl text-[11px] font-bold transition-all bg-indigo-600 text-white shadow-md";
                btnH.className = "flex-1 flex items-center justify-center gap-2 py-2.5 rounded-xl text-[11px] font-bold transition-all text-slate-400 dark:text-slate-500 hover:bg-slate-50 dark:hover:bg-slate-800";
            } else {
                btnH.className = "flex-1 flex items-center justify-center gap-2 py-2.5 rounded-xl text-[11px] font-bold transition-all bg-indigo-600 text-white shadow-md";
                btnA.className = "flex-1 flex items-center justify-center gap-2 py-2.5 rounded-xl text-[11px] font-bold transition-all text-slate-400 dark:text-slate-500 hover:bg-slate-50 dark:hover:bg-slate-800";
            }
            lucide.createIcons();
        }

        function renderAll() {
            document.getElementById('setup-section').classList.toggle('hidden', players.length >= 5 || editingRoundId !== null);
            document.getElementById('chart-section').classList.toggle('hidden', players.length === 0);
            document.getElementById('scoring-section').classList.toggle('hidden', players.length === 0);
            
            document.getElementById('round-count').innerText = `${rounds.length} ván`;
            
            // Cập nhật tiêu đề và nút lưu khi ở chế độ sửa
            if (editingRoundId) {
                const roundIdx = rounds.findIndex(r => r.id === editingRoundId);
                document.getElementById('current-round-title').innerHTML = `<i data-lucide="edit-3" class="w-3.5 h-3.5 text-amber-500"></i> Sửa ván thứ ${roundIdx + 1}`;
                document.getElementById('save-btn-text').innerText = "CẬP NHẬT ĐIỂM VÁN " + (roundIdx + 1);
                document.getElementById('clear-modal-title').innerText = "Hủy sửa ván này?";
            } else {
                document.getElementById('current-round-title').innerHTML = `<i data-lucide="star" class="w-3.5 h-3.5 text-yellow-500 fill-yellow-500"></i> Ván thứ ${rounds.length + 1}`;
                document.getElementById('save-btn-text').innerText = "LƯU ĐIỂM VÁN " + (rounds.length + 1);
                document.getElementById('clear-modal-title').innerText = "Xóa điểm ván này?";
            }
            
            renderPlayersList();
            renderChart();
            renderHistory();
            updateSaveButton();
            lucide.createIcons();
        }

        function renderPlayersList() {
            const list = document.getElementById('players-list');
            list.innerHTML = players.map(p => {
                const score = currentScores[p.id];
                const scoreClass = score > 0 
                    ? 'bg-emerald-50 dark:bg-emerald-900/10 border-emerald-400 dark:border-emerald-500/30 text-emerald-700 dark:text-emerald-400' 
                    : (score < 0 
                        ? 'bg-rose-50 dark:bg-rose-900/10 border-rose-400 dark:border-rose-500/30 text-rose-700 dark:text-rose-400' 
                        : 'bg-white dark:bg-slate-800 border-slate-300 dark:border-slate-700 text-slate-600 dark:text-slate-300');
                
                const chopDisabled = !isTotalCalculated;
                
                return `
                <div class="flex items-center gap-2 p-1.5 bg-slate-50/50 dark:bg-slate-800/40 rounded-2xl border border-slate-200/60 dark:border-slate-800 transition-all h-16">
                    <div class="flex items-center gap-2 flex-1 min-w-0">
                        <div class="w-8 h-8 bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 text-indigo-600 dark:text-indigo-300 rounded-lg flex items-center justify-center font-black text-xs uppercase shadow-sm flex-shrink-0">${p.name.charAt(0)}</div>
                        <span class="text-[13px] font-bold text-slate-700 dark:text-slate-200 truncate">${p.name}</span>
                    </div>
                    <div class="flex gap-1">
                        <button onclick="quickAction('${p.id}', 'AN_SAM')" class="h-10 px-2 rounded-lg text-[8px] font-black uppercase border transition-all bg-indigo-50 dark:bg-indigo-900/20 text-indigo-600 dark:text-indigo-300 border-indigo-100 dark:border-indigo-900/30 flex items-center justify-center">Sâm</button>
                        <button ${chopDisabled ? 'disabled' : ''} onclick="quickAction('${p.id}', 'CHAT_2')" class="h-10 px-2 rounded-lg text-[8px] font-black uppercase border transition-all ${chopDisabled ? 'bg-slate-50 dark:bg-slate-800 text-slate-300 dark:text-slate-600 border-slate-100 dark:border-slate-700 opacity-50' : 'bg-orange-50 dark:bg-orange-900/20 text-orange-600 dark:text-orange-300 border-orange-100 dark:border-orange-900/30'} flex items-center justify-center">Chặt</button>
                    </div>
                    <input type="text" inputmode="numeric" 
                        oninput="handleScoreChange('${p.id}', this.value)" 
                        value="${score !== undefined ? score : ''}" 
                        class="w-16 h-12 text-center font-black rounded-xl border-2 outline-none text-base transition-all flex-shrink-0 ${scoreClass}" 
                        placeholder="0">
                </div>`;
            }).join('');
            lucide.createIcons();
        }

        function renderChart() {
            const container = document.getElementById('chart-bars');
            if (players.length === 0) return;
            const totals = players.map(p => ({ ...p, total: rounds.reduce((s, r) => s + (r.scores[p.id] || 0), 0) }));
            const maxVal = Math.max(...totals.map(t => Math.abs(t.total)), 20);
            const sorted = [...totals].sort((a,b) => b.total - a.total);
            const topId = sorted[0].total > 0 ? sorted[0].id : null;
            const bottomIds = sorted.slice(-2).map(x => x.id);

            container.innerHTML = totals.map(p => {
                const isPos = p.total >= 0;
                const h = (Math.abs(p.total) / maxVal) * 100;
                const isTop = p.id === topId;
                const isBottom = bottomIds.includes(p.id) && totals.length >= 3;
                const poopIcon = '<span class="text-lg mb-1">💩</span>';
                const crownIcon = '<i data-lucide="crown" class="w-4 h-4 text-yellow-500 mb-1 fill-yellow-500 animate-bounce"></i>';

                return `
                <div class="flex-1 flex flex-col items-center relative h-full overflow-visible px-0.5">
                    <div class="flex-1 w-full flex flex-col justify-end items-center relative overflow-visible">
                        ${isPos ? `
                            <div class="absolute flex flex-col items-center z-20" style="bottom: calc(${h}% + 8px)">
                                ${isTop ? crownIcon : ''}
                                ${isBottom && !isTop ? poopIcon : ''}
                                <span class="text-[10px] font-black tabular-nums px-1.5 py-0.5 rounded-md shadow-sm border whitespace-nowrap ${p.total > 0 ? 'text-indigo-600 dark:text-indigo-300 bg-indigo-50 dark:bg-indigo-900/40 border-indigo-100 dark:border-indigo-800' : 'text-slate-400 dark:text-slate-500 bg-white dark:bg-slate-800 border-slate-100 dark:border-slate-700'}">${p.total}</span>
                                <span class="text-[8px] font-bold text-slate-500 dark:text-slate-400 uppercase truncate max-w-[50px] mt-1 text-center leading-none">${p.name}</span>
                            </div>
                            <div class="w-full max-w-[40px] rounded-t-lg bg-gradient-to-t ${isTop ? 'from-yellow-500 to-yellow-300' : 'from-indigo-600 dark:from-indigo-700 to-indigo-400 dark:to-indigo-500'} shadow-sm chart-bar-transition" style="height: ${h}%"></div>
                        ` : ''}
                    </div>
                    <div class="flex-1 w-full flex flex-col justify-start items-center relative overflow-visible">
                        ${!isPos ? `
                            <div class="w-full max-w-[40px] rounded-b-lg bg-gradient-to-b from-rose-500 dark:from-rose-600 to-rose-400 dark:to-rose-500 shadow-sm chart-bar-transition" style="height: ${h}%"></div>
                            <div class="absolute flex flex-col items-center z-20" style="top: calc(${h}% + 8px)">
                                <span class="text-[8px] font-bold text-slate-500 dark:text-slate-400 uppercase truncate max-w-[50px] mb-1 text-center leading-none">${p.name}</span>
                                <span class="text-[10px] font-black text-rose-600 dark:text-rose-400 bg-rose-50 dark:bg-rose-900/40 border border-rose-100 dark:border-rose-800 px-1.5 py-0.5 rounded-md shadow-sm tabular-nums whitespace-nowrap">${p.total}</span>
                                ${isBottom ? poopIcon.replace('mb-1', 'mt-1 animate-pulse') : ''}
                            </div>
                        ` : ''}
                    </div>
                </div>`;
            }).join('');
            lucide.createIcons();
        }

        function renderHistory() {
            const q = document.getElementById('history-search').value;
            const container = document.getElementById('history-list');
            const filtered = rounds.filter(r => fuzzySearch(r.timestamp, q) || players.some(p => fuzzySearch(p.name, q)));
            
            container.innerHTML = filtered.slice().reverse().map((r, idx) => {
                const originalIdx = rounds.findIndex(x => x.id === r.id);
                return `
                <div class="bg-white dark:bg-slate-900 p-4 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-sm relative overflow-hidden">
                    <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-50 dark:border-slate-800">
                        <div class="flex items-center gap-2">
                            <span class="text-[9px] font-black text-indigo-600 dark:text-indigo-400 bg-indigo-50 dark:bg-indigo-900/20 px-2 py-0.5 rounded-md uppercase border border-indigo-100 dark:border-indigo-900/30">VÁN #${originalIdx + 1}</span>
                            <span class="text-[9px] text-slate-400 dark:text-slate-500 font-black">${r.timestamp}</span>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="editRound(${r.id})" class="p-1.5 text-amber-500 bg-amber-50 dark:bg-amber-900/20 rounded-lg hover:scale-110 transition-all">
                                <i data-lucide="edit-3" class="w-3.5 h-3.5"></i>
                            </button>
                            <button onclick="deleteRound(${r.id})" class="p-1.5 text-rose-500 bg-rose-50 dark:bg-rose-900/20 rounded-lg hover:scale-110 transition-all">
                                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                            </button>
                        </div>
                    </div>
                    <div class="grid grid-cols-5 gap-2">
                        ${players.map(p => {
                            const s = r.scores[p.id] || 0;
                            const c = s > 0 
                                ? 'bg-emerald-50 dark:bg-emerald-900/10 text-emerald-600 dark:text-emerald-400 border-emerald-100 dark:border-emerald-900/30' 
                                : (s < 0 ? 'bg-rose-50 dark:bg-rose-900/10 text-rose-600 dark:text-rose-400 border-rose-100 dark:border-rose-900/30' : 'bg-slate-50 dark:bg-slate-800 text-slate-400 dark:text-slate-500 border-slate-100 dark:border-slate-700');
                            return `<div class="text-center"><p class="text-[8px] font-bold text-slate-400 dark:text-slate-500 truncate mb-1">${p.name}</p><div class="py-1.5 rounded-lg font-black text-[11px] border ${c}">${s}</div></div>`;
                        }).join('')}
                    </div>
                </div>`;
            }).join('');
            
            if (!filtered.length) container.innerHTML = '<p class="text-center text-xs text-slate-400 dark:text-slate-600 py-10 font-bold uppercase tracking-widest">Không thấy kết quả</p>';
            lucide.createIcons();
        }

        function renderChopList() {
            document.getElementById('chop-players-list').innerHTML = players.filter(p => p.id !== chopWinnerId).map(p => `
                <button onclick="executeChop('${p.id}')" class="w-full flex items-center justify-between p-4 bg-slate-50 dark:bg-slate-800 hover:bg-indigo-50 dark:hover:bg-indigo-900/30 border border-slate-100 dark:border-slate-700 rounded-2xl group transition-all text-left">
                    <span class="text-sm font-bold text-slate-700 dark:text-slate-200 group-hover:text-indigo-700 dark:group-hover:text-indigo-300">${p.name}</span>
                    <span class="text-xs font-black text-rose-500">-20 điểm</span>
                </button>
            `).join('');
        }

        function updateSaveButton() {
            const btn = document.getElementById('save-round-btn');
            const hasScores = Object.keys(currentScores).length > 0;
            btn.classList.toggle('opacity-50', !hasScores);
            btn.classList.toggle('cursor-not-allowed', !hasScores);
            btn.disabled = !hasScores;
        }

        window.onload = () => { 
            initTheme();
            lucide.createIcons(); 
            renderAll(); 
        };
    </script>
</body>
</html>

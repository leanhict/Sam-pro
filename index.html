<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Thần Sâm - Made by Le Anh</title>

    <!-- CẤU HÌNH ĐỂ TRÔNG NHƯ APP THẬT TRÊN IPHONE -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Thần Sâm">
    
    <!-- ICON APP -->
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: contain; 
            transition: background-color 0.3s ease;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .modal-animate-in {
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .chart-bar-transition {
            transition: height 1s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Hiệu ứng hào quang vương miện */
        @keyframes halo-glow {
            0%, 100% {
                filter: drop-shadow(0 0 2px rgba(250, 204, 21, 0.6)) drop-shadow(0 0 6px rgba(250, 204, 21, 0.3));
                transform: scale(1) translateY(0);
            }
            50% {
                filter: drop-shadow(0 0 6px rgba(250, 204, 21, 0.9)) drop-shadow(0 0 15px rgba(250, 204, 21, 0.5));
                transform: scale(1.1) translateY(-2px);
            }
        }
        .crown-glow {
            animation: halo-glow 2s infinite ease-in-out;
            display: inline-flex;
        }
        .crown-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 16px;
            height: 16px;
            border: 1px solid rgba(250, 204, 21, 0.8);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }
        @keyframes crown-ripple {
            0% {
                width: 14px;
                height: 14px;
                opacity: 1;
            }
            100% {
                width: 152px;
                height: 152px;
                opacity: 0;
            }
        }
        .ring-1 {
            animation: crown-ripple 1.8s infinite cubic-bezier(0.1, 0.8, 0.3, 1);
        }
        .ring-2 {
            animation: crown-ripple 1.8s infinite cubic-bezier(0.1, 0.8, 0.3, 1) 0.6s;
        }
        .ring-3 {
            animation: crown-ripple 1.8s infinite cubic-bezier(0.1, 0.8, 0.3, 1) 1.2s;
        }

        /* Hiệu ứng bốc mùi icon shit */
        .smelly-container {
            display: inline-flex;
            position: relative;
            align-items: center;
            justify-content: center;
        }
        .smelly-smoke {
            position: absolute;
            color: #84cc16; /* lime-500 */
            font-size: 9px;
            font-weight: bold;
            opacity: 0;
            bottom: 12px;
            filter: blur(0.2px);
            pointer-events: none;
            user-select: none;
        }
        @keyframes stink-rise-1 {
            0% {
                transform: translateY(0) translateX(0) scale(0.7) rotate(0deg);
                opacity: 0;
            }
            40% {
                opacity: 0.7;
            }
            80% {
                opacity: 0.3;
            }
            100% {
                transform: translateY(-15px) translateX(3px) scale(1.2) rotate(15deg);
                opacity: 0;
            }
        }
        @keyframes stink-rise-2 {
            0% {
                transform: translateY(0) translateX(0) scale(0.7) rotate(0deg);
                opacity: 0;
            }
            40% {
                opacity: 0.7;
            }
            80% {
                opacity: 0.3;
            }
            100% {
                transform: translateY(-18px) translateX(-4px) scale(1.1) rotate(-15deg);
                opacity: 0;
            }
        }
        .wave-1 {
            left: 2px;
            animation: stink-rise-1 1.8s infinite linear;
        }
        .wave-2 {
            left: 8px;
            animation: stink-rise-2 2.2s infinite linear 0.5s;
        }
        .wave-3 {
            left: 14px;
            animation: stink-rise-1 2s infinite linear 1s;
        }

        /* Tối ưu cho bàn phím số iPhone */
        input[type="text"] {
            font-size: 18px !important;
        }

        /* Hiệu ứng nút Lưu trong Dark Mode */
        .dark .btn-save-glow {
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.3);
            border: 1px solid rgba(129, 140, 248, 0.4);
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 pb-24">

    <!-- Header -->
    <header class="bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 sticky top-0 z-40 px-6 py-4 flex items-center justify-between shadow-sm">
        <div class="flex items-center gap-3">
            <div class="bg-indigo-600 p-2.5 rounded-xl shadow-lg shadow-indigo-200 dark:shadow-none text-white">
                <i data-lucide="flame" class="w-5 h-5"></i>
            </div>
            <div>
                <h1 class="text-base font-black tracking-tight leading-none uppercase text-slate-800 dark:text-slate-100">Thần <span class="text-indigo-600 dark:text-indigo-400">Sâm</span></h1>
                <p class="text-[9px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-widest mt-1">Made by Le Anh</p>
            </div>
        </div>
        <div class="flex gap-2">
            <button onclick="toggleTheme()" class="p-2 text-slate-500 dark:text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 bg-slate-50 dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700 transition-all shadow-sm">
                <i id="theme-icon" data-lucide="moon" class="w-4 h-4"></i>
            </button>
            <button onclick="openModal('reset-modal')" class="p-2 text-slate-500 dark:text-slate-400 hover:text-rose-500 bg-slate-50 dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700 transition-all shadow-sm">
                <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
            </button>
        </div>
    </header>

    <main class="max-w-2xl mx-auto p-4 space-y-5">
        
        <!-- Navigation -->
        <div class="flex bg-white dark:bg-slate-900 p-1 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm">
            <button onclick="switchTab('active')" id="tab-active" class="flex-1 flex items-center justify-center gap-2 py-2.5 rounded-xl text-[11px] font-bold transition-all duration-300 bg-indigo-600 text-white shadow-md">
                <i data-lucide="plus" class="w-3.5 h-3.5"></i> <span class="uppercase tracking-widest font-black">Ghi Điểm</span>
            </button>
            <button onclick="switchTab('history')" id="tab-history" class="flex-1 flex items-center justify-center gap-2 py-2.5 rounded-xl text-[11px] font-bold transition-all duration-300 text-slate-400 dark:text-slate-500 hover:bg-slate-50 dark:hover:bg-slate-800">
                <i data-lucide="history" class="w-3.5 h-3.5"></i> <span class="uppercase tracking-widest font-black">Lịch Sử</span>
            </button>
        </div>

        <!-- VIEW: ACTIVE -->
        <div id="view-active" class="space-y-5">
            <div id="setup-section" class="bg-white dark:bg-slate-900 p-4 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-sm">
                <form onsubmit="addPlayer(event)" class="flex gap-2">
                    <input id="new-player-name" type="text" placeholder="Tên tay chơi mới..." class="flex-1 px-4 py-2 bg-slate-50 dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 focus:ring-2 focus:ring-indigo-500 outline-none text-sm font-bold text-slate-800 dark:text-slate-100">
                    <button type="submit" class="bg-indigo-600 dark:bg-indigo-500 text-white px-4 rounded-xl font-black text-[11px] uppercase shadow-md active:scale-95 text-[10px]">Thêm</button>
                </form>
            </div>

            <div id="chart-section" class="hidden bg-white dark:bg-slate-900 p-5 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-sm relative overflow-visible">
                <div class="flex justify-between items-center mb-14">
                    <div class="flex items-center gap-2">
                        <i data-lucide="trending-up" class="w-4 h-4 text-indigo-600 dark:text-indigo-400"></i>
                        <h2 class="text-xs font-bold text-slate-800 dark:text-slate-200 uppercase tracking-widest">Phong độ hiện tại</h2>
                    </div>
                    <span id="round-count" class="text-[10px] font-bold text-slate-400 dark:text-slate-500 bg-slate-100 dark:bg-slate-800 px-2 py-1 rounded-full uppercase tracking-tighter">0 ván</span>
                </div>
                <div class="relative h-48 flex items-center mb-10 overflow-visible" id="chart-container">
                    <div class="absolute w-full h-[1.5px] bg-slate-200 dark:bg-slate-800 z-0"></div>
                    <div id="chart-bars" class="flex w-full justify-around items-stretch h-full z-10 overflow-visible px-1"></div>
                </div>
            </div>

            <div id="scoring-section" class="hidden bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-sm overflow-hidden">
                <div class="bg-slate-50/80 dark:bg-slate-800/50 px-5 py-3 border-b border-slate-200 dark:border-slate-800 flex justify-between items-center">
                    <h2 id="current-round-title" class="text-[10px] font-black text-slate-800 dark:text-slate-200 uppercase tracking-widest flex items-center gap-2">
                        <i data-lucide="star" class="w-3.5 h-3.5 text-yellow-500 fill-yellow-500"></i> Ván đấu thứ 1
                    </h2>
                    <button onclick="openModal('clear-scores-modal')" class="flex items-center gap-1 text-[9px] font-black text-rose-500 bg-rose-50 dark:bg-rose-900/20 px-2 py-1 rounded-lg border border-rose-100 dark:border-rose-900/30 active:scale-95 transition-all">
                        <i data-lucide="trash-2" class="w-2.5 h-2.5"></i> XÓA ĐIỂM
                    </button>
                </div>
                <div class="p-4 space-y-2.5" id="players-list"></div>
                <div class="p-4 pt-2 space-y-3">
                    <button onclick="calculateTotalLeaves()" class="w-full bg-emerald-50 dark:bg-emerald-900/10 text-emerald-700 dark:text-emerald-400 border-2 border-emerald-200 dark:border-emerald-900/30 py-3 rounded-2xl font-black text-xs uppercase tracking-widest shadow-sm active:scale-95 flex items-center justify-center gap-2">
                        <i data-lucide="calculator" class="w-4 h-4"></i> TÍNH TỔNG LÁ CHO NGƯỜI THẮNG
                    </button>
                    <button onclick="saveRound()" id="save-round-btn" class="w-full bg-indigo-600 dark:bg-indigo-600 text-white py-4 rounded-2xl font-black active:scale-95 flex flex-col items-center justify-center gap-1 shadow-lg shadow-indigo-100 dark:shadow-none transition-all opacity-50 cursor-not-allowed btn-save-glow">
                        <i data-lucide="save" class="w-5 h-5"></i>
                        <span id="save-btn-text" class="text-[10px] uppercase tracking-[0.2em]">LƯU ĐIỂM VÁN 1</span>
                    </button>
                </div>
            </div>
        </div>

        <div id="view-history" class="hidden space-y-4">
            <div class="relative group">
                <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 dark:text-slate-500 w-4 h-4"></i>
                <input type="text" id="history-search" oninput="renderHistory()" placeholder="Tìm ván, điểm, tên..." class="w-full pl-10 pr-4 py-2.5 bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm focus:ring-2 focus:ring-indigo-500 outline-none font-bold text-[13px] text-slate-800 dark:text-slate-100 text-[12px]">
            </div>
            <div id="history-list" class="space-y-3 pb-4"></div>
        </div>
    </main>

    <!-- Modals -->
    <div id="reset-modal" class="fixed inset-0 z-[70] hidden flex items-center justify-center p-6 bg-slate-900/60 backdrop-blur-md">
        <div class="bg-white dark:bg-slate-900 w-full max-w-sm rounded-[32px] shadow-2xl p-8 border border-slate-100 dark:border-slate-800 text-center modal-animate-in">
            <div class="w-16 h-16 bg-rose-50 dark:bg-rose-900/20 text-rose-500 rounded-full flex items-center justify-center mx-auto mb-6"><i data-lucide="rotate-ccw" class="w-8 h-8"></i></div>
            <h3 class="text-lg font-black text-slate-800 dark:text-slate-100 mb-3 uppercase tracking-tight text-center">Xóa sạch trận chơi?</h3>
            <p class="text-sm text-slate-500 dark:text-slate-400 font-medium mb-8 text-center text-[13px]">Dữ liệu sẽ bị xóa hoàn toàn khỏi thiết bị.</p>
            <div class="flex flex-col gap-3">
                <button onclick="resetGame()" class="w-full py-4 bg-rose-500 text-white rounded-2xl font-black text-sm uppercase shadow-lg active:scale-95 text-[11px]">XÓA NGAY</button>
                <button onclick="closeModal('reset-modal')" class="w-full py-4 bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 rounded-2xl font-black text-sm uppercase text-[11px]">HỦY BỎ</button>
            </div>
        </div>
    </div>

    <div id="clear-scores-modal" class="fixed inset-0 z-[70] hidden flex items-center justify-center p-6 bg-slate-900/60 backdrop-blur-md">
        <div class="bg-white dark:bg-slate-900 w-full max-w-sm rounded-[32px] shadow-2xl p-8 border border-slate-100 dark:border-slate-800 text-center modal-animate-in">
            <div class="w-16 h-16 bg-amber-50 dark:bg-amber-900/20 text-amber-500 rounded-full flex items-center justify-center mx-auto mb-6"><i data-lucide="trash-2" class="w-8 h-8"></i></div>
            <h3 id="clear-modal-title" class="text-lg font-black text-slate-800 dark:text-slate-100 mb-3 uppercase tracking-tight text-center">Xóa điểm ván này?</h3>
            <div class="flex flex-col gap-3">
                <button onclick="confirmClearScores()" class="w-full py-4 bg-amber-500 text-white rounded-2xl font-black text-sm uppercase shadow-lg active:scale-95 text-[11px]">XÁC NHẬN</button>
                <button onclick="closeModal('clear-scores-modal')" class="w-full py-4 bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 rounded-2xl font-black text-sm uppercase text-[11px]">HỦY BỎ</button>
            </div>
        </div>
    </div>

    <div id="delete-round-modal" class="fixed inset-0 z-[70] hidden flex items-center justify-center p-6 bg-slate-900/60 backdrop-blur-md">
        <div class="bg-white dark:bg-slate-900 w-full max-w-sm rounded-[32px] shadow-2xl p-8 border border-slate-100 dark:border-slate-800 text-center modal-animate-in">
            <div class="w-16 h-16 bg-rose-50 dark:bg-rose-900/20 text-rose-500 rounded-full flex items-center justify-center mx-auto mb-6"><i data-lucide="trash-2" class="w-8 h-8"></i></div>
            <h3 class="text-lg font-black text-slate-800 dark:text-slate-100 mb-3 uppercase tracking-tight text-center">Xóa ván chơi này?</h3>
            <p class="text-sm text-slate-500 dark:text-slate-400 font-medium mb-8 text-center text-[13px]">Thao tác này không thể hoàn tác.</p>
            <div class="flex flex-col gap-3">
                <button id="confirm-delete-round-btn" class="w-full py-4 bg-rose-500 text-white rounded-2xl font-black text-sm uppercase shadow-lg active:scale-95 text-[11px]">XÓA VÁN</button>
                <button onclick="closeModal('delete-round-modal')" class="w-full py-4 bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 rounded-2xl font-black text-sm uppercase text-[11px]">HỦY BỎ</button>
            </div>
        </div>
    </div>

    <!-- Modal chọn người bị chặt (Dùng chung cho Chặt 2 và Bắt sâm) -->
    <div id="action-target-modal" class="fixed inset-0 z-[60] hidden flex items-center justify-center p-6 bg-slate-900/40 backdrop-blur-sm">
        <div class="bg-white dark:bg-slate-900 w-full max-w-sm rounded-3xl shadow-2xl border border-slate-100 dark:border-slate-800 p-6 modal-animate-in">
            <div class="flex justify-between items-center mb-6">
                <h3 id="action-modal-title" class="text-sm font-black text-slate-800 dark:text-slate-200 uppercase tracking-widest">Ai bị bắt?</h3>
                <button onclick="closeModal('action-target-modal')" class="p-1 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full transition-colors">
                    <i data-lucide="x" class="w-5 h-5 text-slate-400 dark:text-slate-500"></i>
                </button>
            </div>
            <div id="action-target-list" class="space-y-3"></div>
        </div>
    </div>

    <footer class="fixed bottom-0 left-0 right-0 bg-white/90 dark:bg-slate-900/90 backdrop-blur-xl border-t border-slate-200 dark:border-slate-800 py-3 px-6 flex justify-between items-center z-40 shadow-lg">
        <div class="flex items-center gap-2">
            <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
            <span class="text-[10px] font-black text-slate-500 dark:text-slate-400 uppercase tracking-widest uppercase">Thần Sâm Local Mode</span>
        </div>
        <div class="text-[9px] font-black text-slate-300 dark:text-slate-600 uppercase tracking-widest flex items-center gap-2">Made by Le Anh <i data-lucide="chevron-right" class="w-2.5 h-2.5"></i></div>
    </footer>

    <script>
        // --- State Management ---
        let players = JSON.parse(localStorage.getItem('thanSamPlayers') || '[]');
        let rounds = JSON.parse(localStorage.getItem('thanSamRounds') || '[]');
        let currentScores = {};
        let isTotalCalculated = false;
        let actionWinnerId = null;
        let currentActionType = null; 
        let editingRoundId = null;

        // --- Utils ---
        const removeAccents = (str) => {
            if (!str) return '';
            return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D');
        };

        const fuzzySearch = (text, query) => {
            if (!query) return true;
            const cleanQuery = query.trim().replace(/\s+/g, ' ');
            if (text.toLowerCase().includes(cleanQuery.toLowerCase())) return true;
            const nText = removeAccents(text.toLowerCase()).replace(/\s+/g, '');
            const nQuery = removeAccents(cleanQuery.toLowerCase()).replace(/\s+/g, '');
            return nText.includes(nQuery);
        };

        // --- Theme Logic ---
        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            updateThemeUI();
        }

        function updateThemeUI() {
            const isDark = document.documentElement.classList.contains('dark');
            const icon = document.getElementById('theme-icon');
            if (icon) {
                icon.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
                lucide.createIcons();
            }
        }

        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            }
            updateThemeUI();
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        // --- Actions ---
        function addPlayer(e) {
            e.preventDefault();
            const input = document.getElementById('new-player-name');
            const name = input.value.trim();
            if (players.length >= 5) { showNotice("Tối đa 5 người thôi!", "warning"); return; }
            if (!name) return;
            players.push({ id: Date.now().toString(), name });
            input.value = '';
            sync();
        }

        function handleScoreChange(id, val) {
            isTotalCalculated = false;
            const clean = val.replace(/[^0-9-]/g, '');
            if (!clean || clean === '-') {
                delete currentScores[id];
            } else {
                const num = parseInt(clean);
                currentScores[id] = (num > 0 && !val.includes('-')) ? -num : num;
            }
            renderPlayersList();
            updateSaveButton();
        }

        function calculateTotalLeaves() {
            const missing = players.filter(p => currentScores[p.id] === undefined);
            if (missing.length > 1) { showNotice("Hãy nhập điểm cho người thua!", "warning"); return; }
            if (missing.length === 0) return;
            const winnerId = missing[0].id;
            let total = 0;
            players.forEach(p => { if (p.id !== winnerId) total += Math.abs(currentScores[p.id] || 0); });
            if (total === 0) { showNotice("Nhập lá phạt trước!", "warning"); return; }
            currentScores[winnerId] = total;
            isTotalCalculated = true;
            renderPlayersList();
            updateSaveButton();
            showNotice(`+${total} cho ${missing[0].name}`, "success");
        }

        function quickAction(id, type) {
            if (type === 'AN_SAM') {
                players.forEach(p => { currentScores[p.id] = (p.id === id) ? (players.length - 1) * 20 : -20; });
                isTotalCalculated = true;
                renderPlayersList();
                updateSaveButton();
                showNotice("Đã tính điểm Ăn Sâm", "success");
            } else {
                actionWinnerId = id;
                currentActionType = type;
                document.getElementById('action-modal-title').innerText = type === 'CHAT_2' ? "Chặt 2 của ai?" : "Bắt sâm của ai?";
                renderActionTargetList();
                openModal('action-target-modal');
            }
        }

        function executeAction(loserId) {
            const points = currentActionType === 'CHAT_2' ? 20 : 80;
            currentScores[actionWinnerId] = (currentScores[actionWinnerId] || 0) + points;
            currentScores[loserId] = (currentScores[loserId] || 0) - points;
            
            if (currentActionType === 'CHAT_SAM') {
                players.forEach(p => {
                    if (p.id !== actionWinnerId && p.id !== loserId && currentScores[p.id] === undefined) {
                        currentScores[p.id] = 0;
                    }
                });
                isTotalCalculated = true;
            }
            
            closeModal('action-target-modal');
            renderPlayersList();
            updateSaveButton();
            showNotice(`Đã ghi nhận ${currentActionType === 'CHAT_2' ? 'Chặt 2' : 'Bắt Sâm'}!`, "success");
        }

        function saveRound() {
            if (!isTotalCalculated) { showNotice("Hãy tính tổng lá trước!", "warning"); return; }
            const roundData = {
                id: editingRoundId || Date.now(),
                timestamp: new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }),
                scores: { ...currentScores }
            };
            if (editingRoundId) {
                const idx = rounds.findIndex(r => r.id === editingRoundId);
                if (idx !== -1) rounds[idx] = roundData;
                editingRoundId = null;
                showNotice("Đã cập nhật ván chơi", "success");
            } else {
                rounds.push(roundData);
                showNotice("Đã lưu ván mới", "success");
            }
            currentScores = {};
            isTotalCalculated = false;
            sync();
        }

        function editRound(id) {
            const round = rounds.find(r => r.id === id);
            if (!round) return;
            editingRoundId = id;
            currentScores = { ...round.scores };
            isTotalCalculated = true;
            switchTab('active');
            renderAll();
            showNotice("Đang sửa ván đấu...", "info");
        }

        function deleteRound(id) {
            const btn = document.getElementById('confirm-delete-round-btn');
            btn.onclick = () => {
                rounds = rounds.filter(r => r.id !== id);
                if (editingRoundId === id) { editingRoundId = null; currentScores = {}; isTotalCalculated = false; }
                sync();
                closeModal('delete-round-modal');
                showNotice("Đã xóa ván chơi", "info");
            };
            openModal('delete-round-modal');
        }

        function confirmClearScores() {
            currentScores = {};
            isTotalCalculated = false;
            editingRoundId = null;
            closeModal('clear-scores-modal');
            renderAll();
        }

        function resetGame() {
            players = []; rounds = []; currentScores = {}; isTotalCalculated = false; editingRoundId = null;
            localStorage.clear();
            closeModal('reset-modal');
            sync();
        }

        function showNotice(msg, type) {
            const toast = document.createElement('div');
            const bgClass = type === 'warning' ? 'bg-rose-500' : (type === 'success' ? 'bg-emerald-600' : 'bg-slate-800 dark:bg-slate-700');
            toast.className = `fixed top-24 left-1/2 -translate-x-1/2 z-[100] px-5 py-2.5 rounded-2xl shadow-xl text-white font-bold text-[11px] flex items-center gap-2 animate-in slide-in-from-top-4 ${bgClass}`;
            toast.innerHTML = `<i data-lucide="${type==='warning' ? 'alert-circle' : (type === 'success' ? 'check-circle' : 'zap')}" class="w-4 h-4 text-white"></i> ${msg}`;
            document.body.appendChild(toast);
            lucide.createIcons();
            setTimeout(() => toast.remove(), 3000);
        }

        function sync() {
            localStorage.setItem('thanSamPlayers', JSON.stringify(players));
            localStorage.setItem('thanSamRounds', JSON.stringify(rounds));
            renderAll();
        }

        function switchTab(tab) {
            document.getElementById('view-active').classList.toggle('hidden', tab !== 'active');
            document.getElementById('view-history').classList.toggle('hidden', tab !== 'history');
            const btnA = document.getElementById('tab-active');
            const btnH = document.getElementById('tab-history');
            if (tab === 'active') {
                btnA.className = "flex-1 flex items-center justify-center gap-2 py-2.5 rounded-xl text-[11px] font-bold transition-all bg-indigo-600 text-white shadow-md";
                btnH.className = "flex-1 flex items-center justify-center gap-2 py-2.5 rounded-xl text-[11px] font-bold transition-all text-slate-400 dark:text-slate-500 hover:bg-slate-50 dark:hover:bg-slate-800";
            } else {
                btnH.className = "flex-1 flex items-center justify-center gap-2 py-2.5 rounded-xl text-[11px] font-bold transition-all bg-indigo-600 text-white shadow-md";
                btnA.className = "flex-1 flex items-center justify-center gap-2 py-2.5 rounded-xl text-[11px] font-bold transition-all text-slate-400 dark:text-slate-500 hover:bg-slate-50 dark:hover:bg-slate-800";
            }
            lucide.createIcons();
        }

        function renderAll() {
            document.getElementById('setup-section').classList.toggle('hidden', players.length >= 5 || editingRoundId !== null);
            document.getElementById('chart-section').classList.toggle('hidden', players.length === 0);
            document.getElementById('scoring-section').classList.toggle('hidden', players.length === 0);
            document.getElementById('round-count').innerText = `${rounds.length} ván`;
            if (editingRoundId) {
                const roundIdx = rounds.findIndex(r => r.id === editingRoundId);
                document.getElementById('current-round-title').innerHTML = `<i data-lucide="edit-3" class="w-3.5 h-3.5 text-amber-500"></i> Sửa ván thứ ${roundIdx + 1}`;
                document.getElementById('save-btn-text').innerText = "CẬP NHẬT ĐIỂM VÁN " + (roundIdx + 1);
            } else {
                document.getElementById('current-round-title').innerHTML = `<i data-lucide="star" class="w-3.5 h-3.5 text-yellow-500 fill-yellow-500"></i> Ván thứ ${rounds.length + 1}`;
                document.getElementById('save-btn-text').innerText = "LƯU ĐIỂM VÁN " + (rounds.length + 1);
            }
            renderPlayersList(); renderChart(); renderHistory(); updateSaveButton(); lucide.createIcons();
        }

        // --- HIỂN THỊ LABEL ĐẦY ĐỦ ---
        function handleScoreKeyDown(e, idx) {
            if (e.key === 'Enter') {
                e.preventDefault();
                const nextInput = document.getElementById(`score-input-${idx + 1}`);
                if (nextInput) {
                    nextInput.focus();
                    nextInput.select();
                } else {
                    e.target.blur();
                }
            }
        }

        function renderPlayersList() {
            const activeId = document.activeElement ? document.activeElement.id : null;
            const selectionStart = document.activeElement ? document.activeElement.selectionStart : null;
            const selectionEnd = document.activeElement ? document.activeElement.selectionEnd : null;

            const list = document.getElementById('players-list');
            list.innerHTML = players.map((p, idx) => {
                const score = currentScores[p.id];
                const scoreClass = score > 0 ? 'bg-emerald-50 dark:bg-emerald-900/10 border-emerald-400 dark:border-emerald-500/30 text-emerald-700 dark:text-emerald-400' : (score < 0 ? 'bg-rose-50 dark:bg-rose-900/10 border-rose-400 dark:border-rose-500/30 text-rose-700 dark:text-rose-400' : 'bg-white dark:bg-slate-800 border-slate-300 dark:border-slate-700 text-slate-600 dark:text-slate-300');
                
                return `
                <div class="flex items-center gap-1.5 p-1 bg-slate-50/50 dark:bg-slate-800/40 rounded-2xl border border-slate-200/60 dark:border-slate-800 transition-all h-16">
                    <div class="flex items-center gap-1 flex-[0.8] min-w-0">
                        <div class="w-6 h-6 bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 text-indigo-600 dark:text-indigo-300 rounded-lg flex items-center justify-center font-black text-[9px] uppercase shadow-sm flex-shrink-0">${p.name.charAt(0)}</div>
                        <span class="text-[11px] font-bold text-slate-700 dark:text-slate-200 truncate leading-none">${p.name}</span>
                    </div>
                    <div class="flex gap-1 flex-[2.2]">
                        <button onclick="quickAction('${p.id}', 'AN_SAM')" class="h-10 flex-1 rounded-xl text-[9px] font-black uppercase border transition-all bg-indigo-50 dark:bg-indigo-900/20 text-indigo-600 dark:text-indigo-300 border-indigo-100 dark:border-indigo-900/30 flex items-center justify-center whitespace-nowrap px-1">Ăn sâm</button>
                        <button onclick="quickAction('${p.id}', 'CHAT_2')" class="h-10 flex-1 rounded-xl text-[9px] font-black uppercase border transition-all bg-orange-50 dark:bg-orange-900/10 text-orange-600 dark:text-orange-400 border-orange-100 dark:border-orange-900/20 flex items-center justify-center whitespace-nowrap px-1">Chặt 2</button>
                        <button onclick="quickAction('${p.id}', 'CHAT_SAM')" class="h-10 flex-1 rounded-xl text-[9px] font-black uppercase border transition-all bg-rose-50 dark:bg-rose-900/20 text-rose-600 dark:text-rose-400 border-rose-100 dark:border-rose-900/30 flex items-center justify-center whitespace-nowrap px-1">Bắt sâm</button>
                    </div>
                    <input type="text" id="score-input-${idx}" inputmode="numeric" onkeydown="handleScoreKeyDown(event, ${idx})" oninput="handleScoreChange('${p.id}', this.value)" value="${score !== undefined ? score : ''}" class="w-14 h-11 text-center font-black rounded-xl border-2 outline-none text-sm transition-all flex-shrink-0 ${scoreClass}" placeholder="0">
                </div>`;
            }).join('');
            lucide.createIcons();

            if (activeId) {
                const el = document.getElementById(activeId);
                if (el) {
                    el.focus();
                    try {
                        if (selectionStart !== null && selectionEnd !== null) {
                            el.setSelectionRange(selectionStart, selectionEnd);
                        }
                    } catch (e) {}
                }
            }
        }

        function renderChart() {
            const container = document.getElementById('chart-bars');
            if (players.length === 0) return;
            const totals = players.map(p => ({ ...p, total: rounds.reduce((s, r) => s + (r.scores[p.id] || 0), 0) }));
            const maxVal = Math.max(...totals.map(t => Math.abs(t.total)), 20);
            const sorted = [...totals].sort((a,b) => b.total - a.total);
            const topId = sorted[0].total > 0 ? sorted[0].id : null;
            const bottomIds = sorted.slice(-2).map(x => x.id);
            const poopIcon = `
                <div class="smelly-container mb-1">
                    <span class="text-lg animate-bounce inline-block">💩</span>
                    <span class="smelly-smoke wave-1">~</span>
                    <span class="smelly-smoke wave-2">~</span>
                    <span class="smelly-smoke wave-3">~</span>
                </div>`;
            const crownIcon = `
                <div class="crown-glow mb-1 relative w-6 h-6 flex items-center justify-center">
                    <div class="crown-ring ring-1"></div>
                    <div class="crown-ring ring-2"></div>
                    <div class="crown-ring ring-3"></div>
                    <i data-lucide="crown" class="w-4 h-4 text-yellow-500 fill-yellow-500 relative z-10 animate-bounce"></i>
                </div>`;
            container.innerHTML = totals.map(p => {
                const isPos = p.total >= 0;
                const h = (Math.abs(p.total) / maxVal) * 100;
                const isTop = p.id === topId;
                const isBottom = bottomIds.includes(p.id) && totals.length >= 3;
                return `
                <div class="flex-1 flex flex-col items-center relative h-full overflow-visible px-0.5">
                    <div class="flex-1 w-full flex flex-col justify-end items-center relative overflow-visible">
                        ${isPos ? `
                            <div class="absolute flex flex-col items-center z-20" style="bottom: calc(${h}% + 8px)">
                                ${isTop ? crownIcon : ''}
                                ${isBottom && !isTop ? poopIcon : ''}
                                <span class="text-[8px] font-bold text-slate-500 dark:text-slate-400 uppercase truncate max-w-[50px] mb-1 text-center leading-none">${p.name}</span>
                                <span class="text-[10px] font-black tabular-nums px-1.5 py-0.5 rounded-md shadow-sm border whitespace-nowrap ${p.total > 0 ? 'text-indigo-600 dark:text-indigo-300 bg-indigo-50 dark:bg-indigo-900/40 border-indigo-100 dark:border-indigo-800' : 'text-slate-400 dark:text-slate-500 bg-white dark:bg-slate-800 border-slate-100 dark:border-slate-700'}">${p.total}</span>
                            </div>
                            <div class="w-full max-w-[40px] rounded-t-lg bg-gradient-to-t ${isTop ? 'from-yellow-500 to-yellow-300' : 'from-indigo-600 dark:from-indigo-700 to-indigo-400 dark:to-indigo-500'} shadow-sm chart-bar-transition" style="height: ${h}%"></div>
                        ` : ''}
                    </div>
                    <div class="flex-1 w-full flex flex-col justify-start items-center relative overflow-visible">
                        ${!isPos ? `
                            <div class="w-full max-w-[40px] rounded-b-lg bg-gradient-to-b from-rose-500 dark:from-rose-600 to-rose-400 dark:to-rose-500 shadow-sm chart-bar-transition" style="height: ${h}%"></div>
                            <div class="absolute flex flex-col items-center z-20" style="top: calc(${h}% + 8px)">
                                <span class="text-[10px] font-black text-rose-600 dark:text-rose-400 bg-rose-50 dark:bg-rose-900/40 border border-rose-100 dark:border-rose-800 px-1.5 py-0.5 rounded-md shadow-sm tabular-nums whitespace-nowrap mb-1">${p.total}</span>
                                <span class="text-[8px] font-bold text-slate-500 dark:text-slate-400 uppercase truncate max-w-[50px] mb-1 text-center leading-none">${p.name}</span>
                                ${isBottom ? poopIcon.replace('mb-1', 'animate-pulse') : ''}
                            </div>
                        ` : ''}
                    </div>
                </div>`;
            }).join('');
            lucide.createIcons();
        }

        function renderHistory() {
            const q = document.getElementById('history-search').value;
            const container = document.getElementById('history-list');
            const filtered = rounds.filter(r => fuzzySearch(r.timestamp, q) || players.some(p => fuzzySearch(p.name, q)));
            container.innerHTML = filtered.slice().reverse().map((r, idx) => {
                const originalIdx = rounds.findIndex(x => x.id === r.id);
                return `
                <div class="bg-white dark:bg-slate-900 p-4 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-sm relative overflow-hidden">
                    <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-50 dark:border-slate-800">
                        <div class="flex items-center gap-2">
                            <span class="text-[9px] font-black text-indigo-600 dark:text-indigo-400 bg-indigo-50 dark:bg-indigo-900/20 px-2 py-0.5 rounded-md uppercase border border-indigo-100 dark:border-indigo-900/30">VÁN #${originalIdx + 1}</span>
                            <span class="text-[9px] text-slate-400 dark:text-slate-500 font-black">${r.timestamp}</span>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="editRound(${r.id})" class="p-1.5 text-amber-500 bg-amber-50 dark:bg-amber-900/20 rounded-lg hover:scale-110 transition-all"><i data-lucide="edit-3" class="w-3.5 h-3.5"></i></button>
                            <button onclick="deleteRound(${r.id})" class="p-1.5 text-rose-500 bg-rose-50 dark:bg-rose-900/20 rounded-lg hover:scale-110 transition-all"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                        </div>
                    </div>
                    <div class="grid grid-cols-5 gap-2">
                        ${players.map(p => {
                            const s = r.scores[p.id] || 0;
                            const c = s > 0 ? 'bg-emerald-50 dark:bg-emerald-900/10 text-emerald-600 dark:text-emerald-400 border-emerald-100 dark:border-emerald-900/30' : (s < 0 ? 'bg-rose-50 dark:bg-rose-900/10 text-rose-600 dark:text-rose-400 border-rose-100 dark:border-rose-900/30' : 'bg-slate-50 dark:bg-slate-800 text-slate-400 dark:text-slate-500 border-slate-100 dark:border-slate-700');
                            return `<div class="text-center"><p class="text-[8px] font-bold text-slate-400 dark:text-slate-500 truncate mb-1 text-[7px]">${p.name}</p><div class="py-1 rounded-lg font-black text-[10px] border ${c}">${s}</div></div>`;
                        }).join('')}
                    </div>
                </div>`;
            }).join('');
            if (!filtered.length) container.innerHTML = '<p class="text-center text-xs text-slate-400 dark:text-slate-600 py-10 font-bold uppercase tracking-widest text-[10px]">Trống...</p>';
            lucide.createIcons();
        }

        function renderActionTargetList() {
            const list = document.getElementById('action-target-list');
            const points = currentActionType === 'CHAT_2' ? 20 : 80;
            list.innerHTML = players.filter(p => p.id !== actionWinnerId).map(p => `
                <button onclick="executeAction('${p.id}')" class="w-full flex items-center justify-between p-4 bg-slate-50 dark:bg-slate-800 hover:bg-rose-50 dark:hover:bg-rose-900/20 border border-slate-100 dark:border-slate-700 rounded-2xl group transition-all text-left">
                    <span class="text-sm font-bold text-slate-700 dark:text-slate-200 group-hover:text-rose-600 dark:group-hover:text-rose-300 text-[13px]">${p.name}</span>
                    <span class="text-xs font-black text-rose-500 text-[11px]">-${points} điểm</span>
                </button>
            `).join('');
        }

        function updateSaveButton() {
            const btn = document.getElementById('save-round-btn');
            const hasScores = Object.keys(currentScores).length > 0;
            btn.classList.toggle('opacity-50', !hasScores);
            btn.classList.toggle('cursor-not-allowed', !hasScores);
            btn.disabled = !hasScores;
        }

        window.onload = () => { initTheme(); lucide.createIcons(); renderAll(); };
    </script>
</body>
</html>
